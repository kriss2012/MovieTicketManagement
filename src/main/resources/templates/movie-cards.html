<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Browse Movies - BookMyShow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body style="background-color: #f5f5f7;">

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-0">🍿 Browse All Movies</h3>
            <p class="text-muted small mb-0">Explore trending blockbusters, cast details, and showtimes</p>
        </div>
        <div th:if="${session.loggedInUser != null && session.loggedInUser.isAdmin()}">
            <a th:href="@{/movies/add}" class="btn btn-danger fw-bold shadow-sm">
                <i class="bi bi-plus-circle me-1"></i> Add New Movie
            </a>
        </div>
    </div>

    <!-- Movie Cards Grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">

        <div class="col" th:each="movie : ${movies}">
            <div class="bms-movie-card shadow-sm border-0 rounded-4 overflow-hidden h-100 d-flex flex-column">

                <!-- Poster Container -->
                <div class="bms-poster-container">
                    <img th:src="${movie.posterUrl != null && !#strings.isEmpty(movie.posterUrl) ? movie.posterUrl : '/images/movie-placeholder.jpg'}"
                         onerror="this.onerror=null; this.src='/images/movie-placeholder.jpg';"
                         class="bms-poster-img"
                         th:alt="${movie.title}">
                    <div class="bms-rating-overlay">
                        <span><i class="bi bi-star-fill text-warning me-1"></i> <span th:text="${movie.rating != null ? movie.rating : '8.5'}">8.5</span>/10</span>
                        <span class="opacity-75" th:text="${movie.votes != null ? movie.votes : '50K'}">50K Votes</span>
                    </div>
                </div>

                <!-- Card Body -->
                <div class="bms-movie-body p-3 d-flex flex-column flex-grow-1">

                    <h5 class="bms-movie-title fw-bold text-dark mb-1" th:text="${movie.title}">Movie Title</h5>
                    <div class="bms-movie-meta text-muted small mb-2" th:text="${movie.genre}">Genre</div>

                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <span class="badge bg-light text-dark border" th:text="${movie.language}">English</span>
                        <span class="badge bg-light text-dark border" th:text="${movie.duration != null ? movie.duration + ' mins' : '120 mins'}">120 mins</span>
                    </div>

                    <!-- Action Buttons -->
                    <div class="mt-auto d-grid gap-2">
                        <a th:href="@{/movies/details/{id}(id=${movie.movieId})}" class="btn bms-btn-primary fw-bold text-center">
                            <i class="bi bi-ticket-perforated me-1"></i> Book Tickets
                        </a>

                        <div th:if="${session.loggedInUser != null && session.loggedInUser.isAdmin()}" class="btn-group w-100 mt-1">
                            <a th:href="@{/movies/edit/{id}(id=${movie.movieId})}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <a th:href="@{/movies/delete/{id}(id=${movie.movieId})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this movie?')">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </div>
                    </div>

                </div>

            </div>
        </div>

    </div>

</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
