<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Booking Summary & Payment - BookMyShow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>

<body style="background-color: #f2f3f7;">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden mb-4">
                <div class="card-header bg-dark text-white p-4">
                    <h4 class="fw-bold mb-0">🎟 Order Summary</h4>
                </div>
                <div class="card-body p-4 p-md-5">

                    <!-- Movie & Theatre Details -->
                    <div class="d-flex align-items-center gap-4 pb-4 border-bottom mb-4">
                        <img th:src="${show.movie.posterUrl != null ? show.movie.posterUrl : 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80'}"
                             style="width: 100px; height: 140px; object-fit: cover;" class="rounded-3 shadow-sm" th:alt="${show.movie.title}">
                        <div>
                            <h4 class="fw-bold text-dark mb-1" th:text="${show.movie.title}">Movie Title</h4>
                            <div class="text-muted small mb-2" th:text="${show.movie.language + ' • ' + show.movie.genre}">Language & Genre</div>
                            <div class="fw-semibold text-dark mb-1" th:text="${show.theatre.theatreName}">Theatre Name</div>
                            <div class="text-secondary small" th:text="${show.showDate + ' | ' + show.showTime}">Date & Time</div>
                        </div>
                    </div>

                    <!-- Selected Seats -->
                    <div class="bg-light p-3 rounded-3 mb-4 d-flex justify-content-between align-items-center">
                        <div>
                            <span class="text-muted small d-block">SELECTED SEATS</span>
                            <strong class="fs-5 text-danger" th:text="${selectedSeatsStr}">A1, A2</strong>
                        </div>
                        <span class="badge bg-secondary fs-6" th:text="${seatCount + ' Ticket(s)'}">2 Tickets</span>
                    </div>

                    <!-- Payment Form -->
                    <form th:action="@{/bookings/confirm}" method="post">
                        <input type="hidden" name="showId" th:value="${show.showId}">
                        <input type="hidden" name="selectedSeats" th:value="${selectedSeatsStr}">

                        <h5 class="fw-bold mb-3">Contact Details</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Customer Name</label>
                                <input type="text" name="customerName" class="form-control"
                                       th:value="${user != null ? user.fullName : ''}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Customer Email</label>
                                <input type="email" name="customerEmail" class="form-control"
                                       th:value="${user != null ? user.email : ''}" required>
                            </div>
                        </div>

                        <h5 class="fw-bold mb-3">Payment Method</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <div class="form-check card p-3 border cursor-pointer h-100">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="payUpi" value="UPI" checked>
                                    <label class="form-check-label fw-bold ms-2" for="payUpi">
                                        📱 UPI / GPay
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check card p-3 border cursor-pointer h-100">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="payCard" value="CREDIT_CARD">
                                    <label class="form-check-label fw-bold ms-2" for="payCard">
                                        💳 Credit/Debit Card
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check card p-3 border cursor-pointer h-100">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="payNet" value="NET_BANKING">
                                    <label class="form-check-label fw-bold ms-2" for="payNet">
                                        🏦 Net Banking
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Amount Breakdown -->
                        <div class="border-top pt-3 mb-4">
                            <div class="d-flex justify-content-between mb-2 text-muted">
                                <span>Ticket Amount (<span th:text="${seatCount}">1</span> seat(s))</span>
                                <span>₹ <span th:text="${#numbers.formatDecimal(ticketAmount, 1, 2)}">500.00</span></span>
                            </div>
                            <div class="d-flex justify-content-between mb-2 text-muted">
                                <span>Convenience Fee (incl. GST)</span>
                                <span>₹ <span th:text="${#numbers.formatDecimal(convenienceFee, 1, 2)}">70.80</span></span>
                            </div>
                            <div class="d-flex justify-content-between fs-4 fw-bold text-dark pt-2 border-top">
                                <span>Total Amount Payable</span>
                                <span class="text-danger">₹ <span th:text="${#numbers.formatDecimal(totalAmount, 1, 2)}">570.80</span></span>
                            </div>
                        </div>

                        <button type="submit" class="btn bms-btn-primary btn-lg w-100 fw-bold py-3">
                            Make Payment & Confirm Booking
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
