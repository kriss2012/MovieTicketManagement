<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Bookings - BookMyShow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>

<body style="background-color: #f2f3f7;">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">🎟️ My Movie Bookings</h3>
            <p class="text-muted small mb-0">Your past and upcoming ticket purchases</p>
        </div>
        <a th:href="@{/}" class="btn bms-btn-primary">Book New Movie</a>
    </div>

    <div th:if="${bookings == null || bookings.isEmpty()}" class="bg-white p-5 rounded-3 text-center shadow-sm">
        <h4 class="text-muted mb-3">No Bookings Found</h4>
        <p class="text-secondary mb-4">You haven't booked any movie tickets yet.</p>
        <a th:href="@{/}" class="btn bms-btn-primary btn-lg">Explore Movies Now</a>
    </div>

    <div th:if="${bookings != null && !bookings.isEmpty()}" class="row g-4">
        <div class="col-md-6" th:each="b : ${bookings}">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100">
                <div class="card-body p-4 d-flex flex-column">

                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <span class="badge bg-danger" th:text="${b.bookingReference}">BMS-REF</span>
                        <span class="text-muted small" th:text="${#temporals.format(b.bookingDate, 'dd MMM yyyy, HH:mm')}">Date</span>
                    </div>

                    <div class="d-flex gap-3 align-items-center mb-3">
                        <img th:src="${b.show.movie.posterUrl != null ? b.show.movie.posterUrl : 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80'}"
                             style="width: 70px; height: 100px; object-fit: cover;" class="rounded-3 shadow-sm" th:alt="${b.show.movie.title}">
                        <div>
                            <h5 class="fw-bold mb-1 text-dark" th:text="${b.show.movie.title}">Movie</h5>
                            <div class="text-muted small" th:text="${b.show.theatre.theatreName}">Theatre</div>
                            <div class="text-secondary small" th:text="${'Showtime: ' + b.show.showDate + ' | ' + b.show.showTime}">Time</div>
                        </div>
                    </div>

                    <div class="bg-light p-3 rounded-3 mb-3 mt-auto">
                        <div class="d-flex justify-content-between small text-muted mb-1">
                            <span>Seats Reserved</span>
                            <strong class="text-danger" th:text="${b.selectedSeats}">A1, A2</strong>
                        </div>
                        <div class="d-flex justify-content-between small text-muted">
                            <span>Total Paid</span>
                            <strong class="text-dark" th:text="${'₹ ' + #numbers.formatDecimal(b.totalAmount, 1, 2)}">₹ 500</strong>
                        </div>
                    </div>

                    <a th:href="@{/bookings/ticket/{ref}(ref=${b.bookingReference})}" class="btn btn-outline-dark w-100 fw-bold">
                        View Digital Ticket
                    </a>

                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
