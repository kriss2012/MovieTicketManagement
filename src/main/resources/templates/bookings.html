<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>System Bookings - Admin Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>

<body style="background-color: #f2f3f7;">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">📖 All System Bookings</h3>
            <p class="text-muted small mb-0">Complete list of customer transactions</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-dark font-weight-bold">⚡ Admin Dashboard</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Booking ID</th>
                            <th>Reference</th>
                            <th>Customer Name</th>
                            <th>Email</th>
                            <th>Movie</th>
                            <th>Theatre</th>
                            <th>Seats</th>
                            <th>Total Amount</th>
                            <th>Date</th>
                            <th>Digital Pass</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${bookings}">
                            <td class="fw-bold" th:text="${b.bookingId}">1</td>
                            <td class="fw-bold text-danger" th:text="${b.bookingReference}">BMS-REF</td>
                            <td th:text="${b.customerName}">Customer</td>
                            <td th:text="${b.customerEmail}">Email</td>
                            <td class="fw-bold text-dark" th:text="${b.show != null && b.show.movie != null ? b.show.movie.title : 'N/A'}">Movie</td>
                            <td th:text="${b.show != null && b.show.theatre != null ? b.show.theatre.theatreName : 'N/A'}">Theatre</td>
                            <td class="fw-bold text-primary" th:text="${b.selectedSeats != null ? b.selectedSeats : b.numberOfSeats + ' Seats'}">A1, A2</td>
                            <td class="fw-bold text-success" th:text="${'₹ ' + #numbers.formatDecimal(b.totalAmount, 1, 2)}">₹ 500</td>
                            <td class="small text-muted" th:text="${#temporals.format(b.bookingDate, 'dd MMM yyyy HH:mm')}">Date</td>
                            <td>
                                <a th:href="@{/bookings/ticket/{ref}(ref=${b.bookingReference})}" class="btn btn-sm btn-outline-dark">
                                    Ticket
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
