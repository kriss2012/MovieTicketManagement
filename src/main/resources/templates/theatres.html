<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Theatres Network - Admin Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>

<body style="background-color: #f2f3f7;">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">🎭 Theatre Network</h3>
            <p class="text-muted small mb-0">Manage cinema halls and venue details</p>
        </div>
        <a th:href="@{/theatres/add}" class="btn btn-dark font-weight-bold">➕ Add New Theatre</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Theatre Name</th>
                            <th>Location</th>
                            <th>City</th>
                            <th>Capacity</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${theatres}">
                            <td class="fw-bold" th:text="${t.theatreId}">1</td>
                            <td class="fw-bold text-dark" th:text="${t.theatreName}">PVR IMAX</td>
                            <td th:text="${t.location}">Location</td>
                            <td><span class="badge bg-secondary" th:text="${t.city}">Bengaluru</span></td>
                            <td class="fw-bold text-success" th:text="${t.totalSeats + ' Seats'}">120 Seats</td>
                            <td>
                                <a th:href="@{/theatres/edit/{id}(id=${t.theatreId})}" class="btn btn-sm btn-outline-warning me-1">Edit</a>
                                <a th:href="@{/theatres/delete/{id}(id=${t.theatreId})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this theatre?')">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
