<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Login - BookMyShow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bms-auth-body">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5 flex-grow-1">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-md-6 col-lg-5">

            <!-- Demo credentials hint badge -->
            <div class="alert alert-info border-0 shadow-sm rounded-3 mb-4 d-flex align-items-center justify-content-between p-3" style="background: rgba(13, 202, 240, 0.12); color: #0dcaf0; border: 1px solid rgba(13, 202, 240, 0.2) !important;">
                <div>
                    <i class="bi bi-info-circle-fill me-2 fs-5"></i>
                    <strong>Demo User:</strong> <code>user@gmail.com</code> / <code>user123</code>
                </div>
                <button type="button" class="btn btn-sm btn-outline-info rounded-pill" onclick="quickFillUser()">Use Info</button>
            </div>

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden bms-glass-card">
                <div class="card-header bg-dark text-white p-4 text-center border-bottom border-secondary">
                    <h3 class="fw-bold mb-1 text-gradient-primary">🎬 Welcome Back</h3>
                    <p class="mb-0 text-muted small">Sign in to book your favorite movies and shows</p>
                </div>
                <div class="card-body p-4 p-md-5">

                    <div th:if="${errorMessage}" class="alert alert-danger rounded-3 border-0 shadow-sm" th:text="${errorMessage}">Error</div>
                    <div th:if="${successMessage}" class="alert alert-success rounded-3 border-0 shadow-sm" th:text="${successMessage}">Success</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-light">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="userEmailInput" name="email" value="user@gmail.com" class="form-control form-control-lg fs-6 bms-search-input" placeholder="user@gmail.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-light">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" id="userPasswordInput" name="password" value="user123" class="form-control form-control-lg fs-6 bms-search-input" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn bms-btn-primary btn-lg w-100 fw-bold mb-3 shadow">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Account
                        </button>
                    </form>

                    <div class="text-center text-muted small mt-3">
                        Don't have an account? <a th:href="@{/register}" class="text-danger fw-bold text-decoration-none">Register Now</a>
                    </div>
                    <hr class="border-secondary my-4">
                    <div class="text-center text-muted small">
                        Are you an Administrator? <a th:href="@{/admin/login}" class="text-warning fw-bold text-decoration-none"><i class="bi bi-shield-lock me-1"></i> Admin Portal Login</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function quickFillUser() {
        document.getElementById('userEmailInput').value = 'user@gmail.com';
        document.getElementById('userPasswordInput').value = 'user123';
    }
</script>
</body>
</html>
