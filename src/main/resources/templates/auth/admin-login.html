<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin Portal - BookMyShow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bms-auth-body">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5 flex-grow-1">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-md-6 col-lg-5">

            <!-- Demo Admin Info Badge -->
            <div class="alert alert-warning border-0 shadow-sm rounded-3 mb-4 d-flex align-items-center justify-content-between p-3" style="background: rgba(255, 193, 7, 0.12); color: #ffc107; border: 1px solid rgba(255, 193, 7, 0.2) !important;">
                <div>
                    <i class="bi bi-shield-lock-fill me-2 fs-5"></i>
                    <strong>Admin Creds:</strong> <code>admin@bookmyshow.com</code> / <code>admin123</code>
                </div>
                <button type="button" class="btn btn-sm btn-outline-warning rounded-pill" onclick="quickFillAdmin()">Use Info</button>
            </div>

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden bms-glass-card">
                <div class="card-header bg-danger text-white p-4 text-center border-bottom border-danger">
                    <h3 class="fw-bold mb-1"><i class="bi bi-speedometer2 me-2"></i> Admin Portal</h3>
                    <p class="mb-0 text-white-50 small">Management Console Authorization</p>
                </div>
                <div class="card-body p-4 p-md-5">

                    <div th:if="${errorMessage}" class="alert alert-danger rounded-3 border-0 shadow-sm" th:text="${errorMessage}">Error</div>

                    <form th:action="@{/admin/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-light">Admin Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person-badge"></i></span>
                                <input type="email" id="adminEmailInput" name="email" value="admin@bookmyshow.com" class="form-control form-control-lg fs-6 bms-search-input" placeholder="admin@bookmyshow.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-light">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" id="adminPasswordInput" name="password" value="admin123" class="form-control form-control-lg fs-6 bms-search-input" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold mb-3 shadow">
                            <i class="bi bi-shield-check me-2"></i> Access Admin Dashboard
                        </button>
                    </form>

                    <div class="text-center text-muted small mt-3">
                        Looking for standard user login? <a th:href="@{/login}" class="text-info fw-bold text-decoration-none"><i class="bi bi-person-fill me-1"></i> User Sign In</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function quickFillAdmin() {
        document.getElementById('adminEmailInput').value = 'admin@bookmyshow.com';
        document.getElementById('adminPasswordInput').value = 'admin123';
    }
</script>
</body>
</html>
