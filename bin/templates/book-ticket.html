<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Book Ticket</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <h2 class="text-center mb-4">Book Movie Ticket</h2>

    <form th:action="@{/bookings/save}" th:object="${booking}" method="post">

        <div class="mb-3">
            <label>Select Show</label>

            <select class="form-control" th:field="*{show}" required>

                <option value="">Select Show</option>

                <option
                    th:each="show : ${shows}"
                    th:value="${show.showId}"
                    th:text="${show.movie.title + ' | ' + show.theatre.theatreName + ' | ' + show.showDate + ' | ' + show.showTime}">
                </option>

            </select>

        </div>

        <div class="mb-3">
            <label>Customer Name</label>

            <input
                type="text"
                class="form-control"
                th:field="*{customerName}"
                required>
        </div>

        <div class="mb-3">
            <label>Customer Email</label>

            <input
                type="email"
                class="form-control"
                th:field="*{customerEmail}"
                required>
        </div>

        <div class="mb-3">
            <label>Number of Seats</label>

            <input
                type="number"
                class="form-control"
                th:field="*{numberOfSeats}"
                min="1"
                required>
        </div>

        <button class="btn btn-success">
            Book Ticket
        </button>

    </form>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
