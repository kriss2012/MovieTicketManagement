<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>BookMyShow - Movie Ticket Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<!-- Hero Banner Slider -->
<section class="bms-hero-carousel" th:if="${trendingMovies != null && !trendingMovies.isEmpty()}">
    <div class="container">
        <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div th:each="movie, stat : ${trendingMovies}"
                     class="carousel-item" th:classappend="${stat.first} ? 'active'">
                    <div class="bms-banner-card">
                        <img th:src="${movie.bannerUrl}" class="bms-banner-img" th:alt="${movie.title}">
                        <div class="bms-banner-content d-flex justify-content-between align-items-end">
                            <div>
                                <span class="bms-badge-rating mb-2">
                                    <span class="bms-star-icon">★</span>
                                    <span th:text="${movie.rating != null ? movie.rating + '/10' : '8.5/10'}">8.5/10</span>
                                    <span class="ms-1 font-weight-normal text-muted" th:text="${movie.votes != null ? '(' + movie.votes + ')' : '(50K Votes)'}">(50K)</span>
                                </span>
                                <h1 class="fw-bold mb-1" th:text="${movie.title}">Movie Title</h1>
                                <p class="mb-2 text-light opacity-75" th:text="${movie.genre + ' • ' + movie.language + ' • ' + movie.duration + ' mins'}">Genre</p>
                            </div>
                            <div>
                                <a th:href="@{/movies/details/{id}(id=${movie.movieId})}" class="btn bms-btn-primary btn-lg">
                                    Book Tickets
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
</section>

<!-- Filter Bar -->
<div class="bms-filter-bar shadow-sm">
    <div class="container d-flex align-items-center justify-content-between overflow-auto">
        <div class="d-flex align-items-center py-1">
            <span class="fw-bold me-3 text-secondary text-uppercase small">Languages:</span>
            <a th:href="@{/(language='All', genre=${selectedGenre})}" class="bms-filter-pill" th:classappend="${selectedLanguage == 'All' || selectedLanguage == null} ? 'active'">All</a>
            <a th:href="@{/(language='English', genre=${selectedGenre})}" class="bms-filter-pill" th:classappend="${selectedLanguage == 'English'} ? 'active'">English</a>
            <a th:href="@{/(language='Hindi', genre=${selectedGenre})}" class="bms-filter-pill" th:classappend="${selectedLanguage == 'Hindi'} ? 'active'">Hindi</a>
            <a th:href="@{/(language='Tamil', genre=${selectedGenre})}" class="bms-filter-pill" th:classappend="${selectedLanguage == 'Tamil'} ? 'active'">Tamil</a>
            <a th:href="@{/(language='Telugu', genre=${selectedGenre})}" class="bms-filter-pill" th:classappend="${selectedLanguage == 'Telugu'} ? 'active'">Telugu</a>
        </div>
    </div>
</div>

<!-- Movies Section -->
<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-0">Recommended Movies</h3>
            <p class="text-muted small mb-0">Explore the latest blockbusters and book your seats</p>
        </div>
        <a th:href="@{/movies/cards}" class="text-danger text-decoration-none fw-bold small">
            View All Movies &rsaquo;
        </a>
    </div>

    <!-- Movies Grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" th:each="movie : ${movies}">
            <div class="bms-movie-card">
                <div class="bms-poster-container">
                    <img th:src="${movie.posterUrl != null && !movie.posterUrl.isEmpty() ? movie.posterUrl : 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80'}"
                         class="bms-poster-img" th:alt="${movie.title}">
                    <div class="bms-rating-overlay">
                        <span><span class="bms-star-icon">★</span> <span th:text="${movie.rating != null ? movie.rating : '8.5'}">8.5</span>/10</span>
                        <span class="opacity-75" th:text="${movie.votes != null ? movie.votes : '50K'}">50K Votes</span>
                    </div>
                </div>
                <div class="bms-movie-body">
                    <h5 class="bms-movie-title" th:text="${movie.title}">Movie Title</h5>
                    <div class="bms-movie-meta" th:text="${movie.genre}">Action, Drama</div>
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <span class="badge bg-light text-dark border" th:text="${movie.language}">English</span>
                        <span class="badge bg-light text-dark border" th:text="${movie.formats != null ? movie.formats : '2D, 3D'}">2D, 3D</span>
                    </div>
                    <a th:href="@{/movies/details/{id}(id=${movie.movieId})}" class="bms-btn-book">
                        Book Tickets
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
