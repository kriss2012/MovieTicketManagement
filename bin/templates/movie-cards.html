<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Available Movies</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container mt-5">

        <h2 class="text-center mb-5">🎬 Available Movies</h2>

        <div class="row justify-content-center">

            <!-- Movie Card -->
            <div class="col-lg-4 col-md-6 col-sm-12 mb-4 d-flex justify-content-center"
                 th:each="movie : ${movies}">

                <div class="card shadow h-100" style="width:22rem; border-radius:15px;">

                    <!-- Movie Poster -->
                    <img th:src="${movie.posterUrl != null and !#strings.isEmpty(movie.posterUrl)}
                                ? ${movie.posterUrl}
                                : @{/images/movie-placeholder.jpg}"
                         class="card-img-top"
                         alt="Movie Poster"
                         style="height:350px; object-fit:cover;">

                    <!-- Card Body -->
                    <div class="card-body">

                        <h4 class="card-title">

                            <a th:href="@{/movies/details/{id}(id=${movie.movieId})}"
                               class="text-decoration-none text-dark"
                               th:text="${movie.title}">
                            </a>

                        </h4>

                        <hr>

                        <p>
                            <strong>🎭 Genre:</strong>
                            <span th:text="${movie.genre}"></span>
                        </p>

                        <p>
                            <strong>🌐 Language:</strong>
                            <span th:text="${movie.language}"></span>
                        </p>

                        <p>
                            <strong>⏱ Duration:</strong>
                            <span th:text="${movie.duration}"></span> min
                        </p>

                        <p>
                            <strong>⭐ Rating:</strong>
                            <span th:text="${movie.rating}"></span>
                        </p>

                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer text-center">

                        <a href="#" class="btn btn-success btn-sm">
                            🎟 Book Now
                        </a>

                        <a th:href="@{/movies/edit/{id}(id=${movie.movieId})}"
                           class="btn btn-warning btn-sm">
                            ✏ Edit
                        </a>

                        <a th:href="@{/movies/delete/{id}(id=${movie.movieId})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this movie?')">
                            🗑 Delete
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
