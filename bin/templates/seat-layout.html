<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Select Seats - BookMyShow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>

<body style="background-color: #f8f9fa; padding-bottom: 100px;">

<div th:replace="fragments/navbar :: navbar"></div>

<!-- Top Sticky Theatre Bar -->
<div class="bg-white border-bottom shadow-sm py-3 mb-4">
    <div class="container d-flex flex-column flex-md-row align-items-md-center justify-content-between">
        <div>
            <h4 class="fw-bold mb-1" th:text="${show.movie.title}">Movie Title</h4>
            <div class="text-muted small">
                <span th:text="${show.theatre.theatreName + ' | ' + show.theatre.location}">Theatre</span> •
                <span th:text="${show.showDate + ' at ' + show.showTime}">Show Time</span>
            </div>
        </div>
        <div class="mt-2 mt-md-0">
            <span class="badge bg-danger fs-6" th:text="${'Ticket Price: ₹ ' + show.ticketPrice}">₹ 250</span>
        </div>
    </div>
</div>

<main class="container">
    <div class="bg-white p-4 p-md-5 rounded-3 shadow-sm mb-5 text-center">

        <!-- Screen Indicator Arc -->
        <div class="bms-screen-wrapper">
            <div class="bms-screen-arc"></div>
            <div class="bms-screen-text">All eyes this way please</div>
        </div>

        <!-- Legend -->
        <div class="d-flex justify-content-center gap-4 mb-4 text-muted small">
            <div class="d-flex align-items-center gap-2">
                <div class="seat-box" style="width:20px; height:20px;"></div>
                <span>Available</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div class="seat-box selected" style="width:20px; height:20px;"></div>
                <span>Selected</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div class="seat-box booked" style="width:20px; height:20px;"></div>
                <span>Sold Out</span>
            </div>
        </div>

        <!-- Seat Matrix Container -->
        <div class="seat-matrix-wrapper my-4 overflow-auto">

            <!-- RECLINER TIER -->
            <div class="bms-tier-title">Recliner Tier - ₹ <span th:text="${show.ticketPrice + 100}">350</span></div>
            <div th:each="rowCode : ${#strings.arraySplit('A,B', ',')}" class="seat-row">
                <span class="seat-row-label" th:text="${rowCode}">A</span>
                <div th:each="colNum : ${#numbers.sequence(1, 10)}"
                     th:with="seatId=${rowCode + colNum}, isBooked=${bookedSeats != null && bookedSeats.contains(seatId)}"
                     class="seat-box"
                     th:classappend="${isBooked} ? 'booked' : ''"
                     th:data-seat="${seatId}"
                     th:data-price="${show.ticketPrice + 100}"
                     th:text="${colNum}">
                    1
                </div>
                <span class="seat-row-label" th:text="${rowCode}">A</span>
            </div>

            <!-- PRIME TIER -->
            <div class="bms-tier-title">Prime / VIP Tier - ₹ <span th:text="${show.ticketPrice}">250</span></div>
            <div th:each="rowCode : ${#strings.arraySplit('C,D,E', ',')}" class="seat-row">
                <span class="seat-row-label" th:text="${rowCode}">C</span>
                <div th:each="colNum : ${#numbers.sequence(1, 12)}"
                     th:with="seatId=${rowCode + colNum}, isBooked=${bookedSeats != null && bookedSeats.contains(seatId)}"
                     class="seat-box"
                     th:classappend="${isBooked} ? 'booked' : ''"
                     th:data-seat="${seatId}"
                     th:data-price="${show.ticketPrice}"
                     th:text="${colNum}">
                    1
                </div>
                <span class="seat-row-label" th:text="${rowCode}">C</span>
            </div>

            <!-- EXECUTIVE TIER -->
            <div class="bms-tier-title">Executive Tier - ₹ <span th:text="${show.ticketPrice - 50}">180</span></div>
            <div th:each="rowCode : ${#strings.arraySplit('F,G,H', ',')}" class="seat-row">
                <span class="seat-row-label" th:text="${rowCode}">F</span>
                <div th:each="colNum : ${#numbers.sequence(1, 12)}"
                     th:with="seatId=${rowCode + colNum}, isBooked=${bookedSeats != null && bookedSeats.contains(seatId)}"
                     class="seat-box"
                     th:classappend="${isBooked} ? 'booked' : ''"
                     th:data-seat="${seatId}"
                     th:data-price="${show.ticketPrice - 50}"
                     th:text="${colNum}">
                    1
                </div>
                <span class="seat-row-label" th:text="${rowCode}">F</span>
            </div>

        </div>

    </div>
</main>

<!-- Bottom Sticky Selection Drawer -->
<div class="bms-bottom-drawer">
    <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
        <div>
            <div class="small text-muted">Selected Seats: <strong id="selectedSeatsDisplay" class="text-dark">None</strong></div>
            <div class="fw-bold fs-5 text-danger" id="totalAmountDisplay">₹ 0.00</div>
        </div>

        <form th:action="@{/bookings/summary}" method="post" id="seatForm" class="d-flex align-items-center gap-3">
            <input type="hidden" name="showId" th:value="${show.showId}">
            <input type="hidden" name="selectedSeats" id="selectedSeatsInput" value="">
            <button type="submit" id="checkoutBtn" class="btn bms-btn-primary btn-lg px-5" disabled>
                Book Tickets (<span id="seatCountDisplay">0</span>)
            </button>
        </form>
    </div>
</div>

<script th:src="@{/js/seat-selection.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
