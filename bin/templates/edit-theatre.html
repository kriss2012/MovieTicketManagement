<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Theatre - Admin Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>
<body style="background-color: #f2f3f7;">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white p-4 d-flex justify-content-between align-items-center">
                    <h4 class="fw-bold mb-0">✏️ Edit Theatre</h4>
                    <a th:href="@{/theatres}" class="btn btn-sm btn-outline-light">Back</a>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/theatres/update}" th:object="${theatre}" method="post">
                        <input type="hidden" th:field="*{theatreId}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Theatre Name</label>
                            <input type="text" class="form-control" th:field="*{theatreName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Location</label>
                            <input type="text" class="form-control" th:field="*{location}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">City</label>
                            <input type="text" class="form-control" th:field="*{city}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Total Seat Capacity</label>
                            <input type="number" class="form-control" th:field="*{totalSeats}" required>
                        </div>
                        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">Update Theatre</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
