<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Movies Directory - Admin Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>

<body style="background-color: #f2f3f7;">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">🎬 Movie Catalogue</h3>
            <p class="text-muted small mb-0">Manage system movies and media assets</p>
        </div>
        <a th:href="@{/movies/add}" class="btn btn-danger font-weight-bold">➕ Add New Movie</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Poster</th>
                            <th>Title</th>
                            <th>Genre</th>
                            <th>Language</th>
                            <th>Duration</th>
                            <th>Rating</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${movies}">
                            <td>
                                <img th:src="${m.posterUrl != null ? m.posterUrl : 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80'}"
                                     style="width: 45px; height: 60px; object-fit: cover;" class="rounded" th:alt="${m.title}">
                            </td>
                            <td>
                                <strong class="text-dark d-block" th:text="${m.title}">Title</strong>
                                <span class="small text-muted" th:text="${m.cast}">Cast</span>
                            </td>
                            <td th:text="${m.genre}">Genre</td>
                            <td><span class="badge bg-light text-dark border" th:text="${m.language}">Language</span></td>
                            <td th:text="${m.duration + ' mins'}">Duration</td>
                            <td>
                                <span class="badge bg-warning text-dark" th:text="${'★ ' + (m.rating != null ? m.rating : '8.5')}">8.5</span>
                            </td>
                            <td>
                                <a th:href="@{/movies/details/{id}(id=${m.movieId})}" class="btn btn-sm btn-outline-primary me-1">View</a>
                                <a th:href="@{/movies/edit/{id}(id=${m.movieId})}" class="btn btn-sm btn-outline-warning me-1">Edit</a>
                                <a th:href="@{/movies/delete/{id}(id=${m.movieId})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this movie?')">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
