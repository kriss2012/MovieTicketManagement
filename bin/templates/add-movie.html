<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Movie - Admin Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>

<body style="background-color: #f2f3f7;">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white p-4 d-flex justify-content-between align-items-center">
                    <h4 class="fw-bold mb-0">🎬 Add New Movie</h4>
                    <a th:href="@{/movies}" class="btn btn-sm btn-outline-light">Back to List</a>
                </div>
                <div class="card-body p-4 p-md-5">

                    <form th:action="@{/movies/save}" th:object="${movie}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Movie Title</label>
                                <input type="text" class="form-control" th:field="*{title}" placeholder="e.g. Oppenheimer" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Genre</label>
                                <input type="text" class="form-control" th:field="*{genre}" placeholder="e.g. Action, Sci-Fi" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Language(s)</label>
                                <input type="text" class="form-control" th:field="*{language}" placeholder="e.g. English, Hindi" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Duration (Minutes)</label>
                                <input type="number" class="form-control" th:field="*{duration}" placeholder="180" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Release Date</label>
                                <input type="date" class="form-control" th:field="*{releaseDate}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Rating (1.0 - 10.0)</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{rating}" placeholder="8.8">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Certification</label>
                                <input type="text" class="form-control" th:field="*{certification}" placeholder="UA / A / U">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Cast / Actors</label>
                                <input type="text" class="form-control" th:field="*{cast}" placeholder="Cillian Murphy, Emily Blunt">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Available Formats</label>
                                <input type="text" class="form-control" th:field="*{formats}" placeholder="2D, 3D, IMAX 3D">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Poster Image URL</label>
                            <input type="text" class="form-control" th:field="*{posterUrl}" placeholder="https://image-host/poster.jpg">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Hero Banner Backdrop URL</label>
                            <input type="text" class="form-control" th:field="*{bannerUrl}" placeholder="https://image-host/banner.jpg">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Trailer Embed URL</label>
                            <input type="text" class="form-control" th:field="*{trailerUrl}" placeholder="https://www.youtube.com/embed/...">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Synopsis / Description</label>
                            <textarea class="form-control" rows="3" th:field="*{description}" placeholder="Movie storyline description..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold">
                            Save Movie to Catalogue
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
