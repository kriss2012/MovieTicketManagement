<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin Portal - BookMyShow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>

<body style="background-color: #12151e; color: #ffffff;">

<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="background-color: #1f2533; color: #ffffff;">
                <div class="card-header bg-danger text-white p-4 text-center">
                    <h4 class="fw-bold mb-1">⚡ Admin Portal Login</h4>
                    <p class="mb-0 text-white-50 small">Management Console Authorization</p>
                </div>
                <div class="card-body p-4 p-md-5">

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Error</div>

                    <form th:action="@{/admin/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-light">Admin Email</label>
                            <input type="email" name="email" class="form-control form-control-lg fs-6 bms-search-input" placeholder="admin@bookmyshow.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-light">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg fs-6 bms-search-input" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold mb-3">
                            Access Admin Dashboard
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
