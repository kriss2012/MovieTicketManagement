<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Show - Admin Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bookmyshow.css}">
</head>
<body style="background-color: #f2f3f7;">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white p-4 d-flex justify-content-between align-items-center">
                    <h4 class="fw-bold mb-0">✏️ Edit Show</h4>
                    <a th:href="@{/shows}" class="btn btn-sm btn-outline-light">Back</a>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/shows/update}" th:object="${show}" method="post">
                        <input type="hidden" th:field="*{showId}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Movie</label>
                            <select class="form-select" th:field="*{movie}" required>
                                <option th:each="m : ${movies}" th:value="${m.movieId}" th:text="${m.title}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Theatre</label>
                            <select class="form-select" th:field="*{theatre}" required>
                                <option th:each="t : ${theatres}" th:value="${t.theatreId}" th:text="${t.theatreName + ' (' + t.city + ')'}"></option>
                            </select>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Show Date</label>
                                <input type="date" class="form-control" th:field="*{showDate}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Show Time</label>
                                <input type="time" class="form-control" th:field="*{showTime}" required>
                            </div>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Ticket Price (₹)</label>
                                <input type="number" step="10" class="form-control" th:field="*{ticketPrice}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Available Seats</label>
                                <input type="number" class="form-control" th:field="*{availableSeats}" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">Update Show Schedule</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
